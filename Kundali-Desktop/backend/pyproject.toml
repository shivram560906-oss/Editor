# ── Ruff configuration ──────────────────────────────────────────────
# Ruff is a fast Python linter + formatter. Run with:
#   ruff check backend/        # lint
#   ruff format backend/       # format
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "alembic/versions",   # auto-generated migrations
    "backups",
]

[tool.ruff.lint]
# Enforce correctness-critical rules in CI now. The broader E/W/F/I/UP/B
# cleanup remains incremental because enabling it at once exposes hundreds of
# pre-existing style findings and would make the upgrade branch undeployable.
select = [
    "E9",   # syntax/runtime errors
    "F63",  # invalid comparisons and assertions
    "F7",   # invalid control flow
    "F82",  # undefined names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
