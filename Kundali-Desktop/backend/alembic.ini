# Alembic configuration for the Parashari Jyotish backend.
# The actual database URL is injected from backend/config.py (env.py) so the
# same DATABASE_URL / .env mechanism is used as the rest of the app.

[alembic]
# Placeholder; overridden in env.py via config.set_main_option().
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
